name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npm run lint && npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Validate content (decodability checker)
        run: npm run validate-content
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Install WebKit and Chromium
        run: npx playwright install --with-deps webkit chromium
      - name: End-to-end tests (WebKit, iPad viewport)
        run: npm run test:e2e
      # Playwright supports service workers only in Chromium, so the offline
      # cold-start test runs there (it is skipped in the WebKit pass above).
      - name: Offline cold start (Chromium)
        run: npx playwright test --project=chromium tests/e2e/offline.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
